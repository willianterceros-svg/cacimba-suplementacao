<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244c25">
<title>Controle de Suplementação Agropecuária Cacimba</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--verde:#244c25;--verde2:#7db33f;--creme:#f5efcf;--bg:#f4f6f2;--line:#dce3dc;--muted:#6d776f;--danger:#9d3333}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#1e2b22}
.top{background:var(--verde);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
.brand{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}
.brand img{width:58px;height:40px;object-fit:cover;border-radius:9px;background:#fff}
.brand h1{font-size:17px;margin:0}
.brand p{margin:3px 0 0;font-size:12px;opacity:.82}
.wrap{max-width:900px;margin:16px auto;padding:0 14px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}
h2{font-size:19px;margin:0 0 14px} h3{font-size:16px;margin:18px 0 8px}
label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5cd;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:800;background:var(--verde);color:#fff}
.btn.alt{background:#e8efe8;color:var(--verde)} .btn.danger{background:#faeaea;color:var(--danger)}
.btn.smallbtn{padding:8px 10px;font-size:12px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;white-space:nowrap;font-weight:750;color:#405047}
.tab.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.hidden{display:none!important} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px} .full{grid-column:1/-1}
.reading{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reading button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px 5px;font-weight:750}
.reading button.on{background:#e1efd6;border-color:var(--verde2);color:var(--verde)}
.item{padding:11px 0;border-top:1px solid #edf0ed} .item:first-child{border-top:0}
.small{font-size:12px;color:var(--muted);line-height:1.4}
.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf4e7;color:var(--verde);font-size:10px;font-weight:850}
.ownerTag{background:var(--creme);color:var(--verde)}
.msg{padding:10px;border-radius:10px;background:#edf5ed;margin-top:10px;font-size:13px} .msg.err{background:#faeaea;color:#8d2a2a}
.login{max-width:430px;margin:26px auto}
.loginBrand{text-align:center;margin-bottom:15px}
.loginBrand img{max-width:330px;width:100%;border-radius:14px;display:block;margin:0 auto 12px}
.row{display:flex;gap:8px;align-items:center} .row>*{flex:1}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{padding:12px;background:#f4f8f4;border-radius:12px} .metric b{display:block;font-size:20px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));font-size:11px;text-align:center;color:var(--muted)}
@media(max-width:620px){.grid,.summary{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.brand h1{font-size:15px}}
</style>
</head>

    <div><h1>Controle de Suplementação Agropecuária Cacimba</h1><p id="who"></p></div>

    <div class="tabs">

          <div><label>Data e hora</label><input id="occurred" type="datetime-local"></div>
          <div><label>Lote</label><select id="lot"></select></div>
          <div><label>Produto</label><select id="product"></select></div>
          <div><label>Quantidade (kg)</label><input id="qty" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Ex.: 50"></div>
          <div class="full"><label>Leitura do cocho</label>
            <div class="reading">
              <button onclick="setReading('empty',this)">Vazio</button>
              <button onclick="setReading('medium',this)">Médio</button>
              <button onclick="setReading('full',this)">Cheio</button>
            </div>
          </div>
          <div class="full"><label>Observação (opcional)</label><textarea id="notes"></textarea></div>
          <div class="full"><button class="btn" style="width:100%" onclick="saveFeeding()">Registrar trato e leitura</button><div id="feedMsg"></div></div>
        </div>
      </div>
    </section>

      <div class="card"><h2>Histórico</h2><div id="history"></div></div>
    </section>

      </div>

<script>
const SB_URL='https://kwogzwdidzenfmdxmiwv.supabase.co';
const SB_KEY='sb_publishable_2xZ6R8_k2_EfR6Dv02Gfyg_8U0wg2AU';
const sb=supabase.createClient(SB_URL,SB_KEY);
let profile=null,lots=[],products=[],reading=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const roleName=r=>r==='owner'?'Proprietário':r==='admin'?'Administrador':'Campo';

function msg(id,t,err=false){$ (id);document.getElementById(id).innerHTML=t?`<div class="msg ${err?'err':''}">${esc(t)}</div>`:''}
function localNow(){let d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
$('occurred').value=localNow(); $('reportMonth').value=localNow().slice(0,7);
function loginEmail(v){v=v.trim().toLowerCase();return v.includes('@')?v:v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]/g,'')+'@cacimba.local'}

async function signIn(){
  msg('loginMsg','');
  const {error}=await sb.auth.signInWithPassword({email:loginEmail($('loginId').value),password:$('loginPass').value});
  if(error)return msg('loginMsg','Usuário ou PIN incorretos.',true);
  try{await sb.rpc('claim_first_owner')}catch(e){}
  await boot();
}

async function firstOwner(){
  const id=$('loginId').value.trim(),pass=$('loginPass').value;
  if(id.toLowerCase()!=='willianterceros@gmail.com')return msg('loginMsg','Use o e-mail do Proprietário cadastrado para criar o primeiro acesso.',true);
  if(pass.length<6)return msg('loginMsg','Informe uma senha de pelo menos 6 caracteres.',true);
  const {data,error}=await sb.auth.signUp({email:id,password:pass,options:{data:{full_name:'Willian'}}});
  if(error)return msg('loginMsg',error.message,true);
  if(data.session){await sb.rpc('claim_first_owner');await boot()}
  else msg('loginMsg','Conta criada. Confirme o e-mail recebido e depois entre.');
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession(); if(!session)return;
  const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!p)return;
  if(!p.active){await sb.auth.signOut();return msg('loginMsg','Seu acesso está desativado.',true)}
  profile=p; $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('who').textContent=`${p.full_name} · ${roleName(p.role)}`;
  document.querySelectorAll('.admin').forEach(x=>x.style.display=p.role==='field'?'none':'inline-block');
  if(p.role!=='owner')$('userRole').querySelector('option[value="admin"]').disabled=true;
  await loadMasters(); await loadHistory();
}

async function logout(){await sb.auth.signOut();location.reload()}
function showTab(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(id==='historico')loadHistory();if(id==='cadastros')loadUsers()}
function setReading(v,b){reading=v;document.querySelectorAll('.reading button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}

async function loadMasters(){
  const [a,b]=await Promise.all([sb.from('lots').select('*').order('name'),sb.from('products').select('*').order('name')]);
  lots=a.data||[]; products=b.data||[];
  const activeLots=lots.filter(x=>x.active), activeProducts=products.filter(x=>x.active);
  $('lot').innerHTML=activeLots.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  $('reportLot').innerHTML='<option value="">Todos</option>'+activeLots.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  $('product').innerHTML=activeProducts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  $('lotsList').innerHTML=lots.map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="pill">${x.active?'ATIVO':'INATIVO'}</span><div class="actions"><button class="btn alt smallbtn" onclick="renameMaster('lots','${x.id}','${esc(x.name).replace(/'/g,"&#39;")}')">Editar</button><button class="btn ${x.active?'danger':'alt'} smallbtn" onclick="toggleMaster('lots','${x.id}',${x.active})">${x.active?'Desativar':'Reativar'}</button></div></div>`).join('');
  $('productsList').innerHTML=products.map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="pill">${x.active?'ATIVO':'INATIVO'}</span><div class="actions"><button class="btn alt smallbtn" onclick="renameMaster('products','${x.id}','${esc(x.name).replace(/'/g,"&#39;")}')">Editar</button><button class="btn ${x.active?'danger':'alt'} smallbtn" onclick="toggleMaster('products','${x.id}',${x.active})">${x.active?'Desativar':'Reativar'}</button></div></div>`).join('');
}

async function addLot(){let n=$('newLot').value.trim();if(!n)return;let {error}=await sb.from('lots').insert({name:n,created_by:profile.id});if(error)return alert(error.message);$('newLot').value='';await loadMasters()}
async function addProduct(){let n=$('newProduct').value.trim();if(!n)return;let {error}=await sb.from('products').insert({name:n,created_by:profile.id});if(error)return alert(error.message);$('newProduct').value='';await loadMasters()}
async function renameMaster(table,id,current){let n=prompt('Novo nome:',current);if(!n||!n.trim())return;let {error}=await sb.from(table).update({name:n.trim()}).eq('id',id);if(error)return alert(error.message);await loadMasters()}
async function toggleMaster(table,id,active){if(!confirm(`${active?'Desativar':'Reativar'} este cadastro?`))return;let {error}=await sb.from(table).update({active:!active}).eq('id',id);if(error)return alert(error.message);await loadMasters()}

async function saveFeeding(){
  msg('feedMsg','');
  if(!$('lot').value||!$('product').value||!$('qty').value||!reading)return msg('feedMsg','Preencha lote, produto, quantidade e leitura do cocho.',true);
  const {error}=await sb.from('feeding_records').insert({
    occurred_at:new Date($('occurred').value).toISOString(),
    lot_id:$('lot').value,product_id:$('product').value,
    quantity_kg:Number($('qty').value),trough_reading:reading,
    recorded_by:profile.id,notes:$('notes').value.trim()||null
  });
  if(error)return msg('feedMsg',error.message,true);
  $('qty').value='';$('notes').value='';reading=null;document.querySelectorAll('.reading button').forEach(x=>x.classList.remove('on'));$('occurred').value=localNow();
  msg('feedMsg','Trato registrado com sucesso.'); await loadHistory();
}

async function loadHistory(){
  const {data,error}=await sb.from('feeding_records').select('*,lots(name),products(name),profiles!feeding_records_recorded_by_fkey(full_name)').order('occurred_at',{ascending:false}).limit(100);
  if(error){$('history').textContent=error.message;return}
  let rr={empty:'Vazio',medium:'Médio',full:'Cheio'};
  $('history').innerHTML=(data||[]).map(x=>`<div class="item"><b>${esc(x.lots?.name)} · ${esc(x.products?.name)}</b><div>${Number(x.quantity_kg).toLocaleString('pt-BR')} kg · Cocho ${rr[x.trough_reading]}</div><div class="small">${new Date(x.occurred_at).toLocaleString('pt-BR')} · ${esc(x.profiles?.full_name||'')}</div>${x.notes?`<div class="small">Obs.: ${esc(x.notes)}</div>`:''}</div>`).join('')||'<div class="small">Nenhum registro.</div>';
}

async function invokeAdmin(body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(`${SB_URL}/functions/v1/admin-users`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SB_KEY},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok||j.ok===false)throw new Error(j.error||'Erro'); return j;
}

async function createUser(){
  try{
    let role=$('userRole').value;
    if(role==='admin'&&profile.role!=='owner')throw new Error('Somente o Proprietário pode criar administradores.');
    await invokeAdmin({action:'create',full_name:$('userName').value.trim(),login_name:$('userLogin').value.trim(),password:$('userPin').value.trim(),role});
    $('userName').value=$('userLogin').value=$('userPin').value='';await loadUsers();alert('Usuário criado.');
  }catch(e){alert(e.message)}
}

async function loadUsers(){
  const {data,error}=await sb.from('profiles').select('*').order('created_at');if(error){$('usersList').textContent=error.message;return}
  $('usersList').innerHTML=(data||[]).map(u=>`<div class="item"><b>${esc(u.full_name)}</b> ${u.protected_owner?'<span class="pill ownerTag">PROPRIETÁRIO PROTEGIDO</span>':''}<div class="small">${u.login_name?`Usuário: ${esc(u.login_name)} · `:''}${roleName(u.role)} · ${u.active?'Ativo':'Inativo'}</div>${u.protected_owner?'<div class="small">Este usuário não pode ser desativado, excluído ou rebaixado.</div>':`<div class="actions"><button class="btn ${u.active?'danger':'alt'} smallbtn" onclick="toggleUser('${u.id}')">${u.active?'Desativar':'Reativar'}</button>${profile.role==='owner'?`<button class="btn alt smallbtn" onclick="changeRole('${u.id}','${u.role==='admin'?'field':'admin'}')">${u.role==='admin'?'Tornar Campo':'Tornar Admin'}</button>`:''}</div>`}</div>`).join('');
}

async function toggleUser(id){try{await invokeAdmin({action:'toggle',user_id:id});await loadUsers()}catch(e){alert(e.message)}}
async function changeRole(id,role){try{await invokeAdmin({action:'role',user_id:id,role});await loadUsers()}catch(e){alert(e.message)}}

async function runReport(){
  let m=$('reportMonth').value;if(!m)return;
  let s=new Date(m+'-01T00:00:00'),e=new Date(s);e.setMonth(e.getMonth()+1);
  let q=sb.from('feeding_records').select('*,lots(name),products(name),profiles!feeding_records_recorded_by_fkey(full_name)').gte('occurred_at',s.toISOString()).lt('occurred_at',e.toISOString()).order('occurred_at');
  if($('reportLot').value)q=q.eq('lot_id',$('reportLot').value);
  const {data,error}=await q;if(error){$('reportOut').textContent=error.message;return}
  let total=(data||[]).reduce((a,x)=>a+Number(x.quantity_kg),0),days=new Set((data||[]).map(x=>new Date(x.occurred_at).toLocaleDateString('pt-BR'))).size;
  $('reportOut').innerHTML=`<div class="summary"><div class="metric"><span class="small">Tratos</span><b>${data.length}</b></div><div class="metric"><span class="small">Quantidade</span><b>${total.toLocaleString('pt-BR')} kg</b></div><div class="metric"><span class="small">Dias com trato</span><b>${days}</b></div></div>`+(data||[]).map(x=>`<div class="item"><b>${new Date(x.occurred_at).toLocaleDateString('pt-BR')} · ${esc(x.lots?.name)}</b><div>${esc(x.products?.name)} — ${Number(x.quantity_kg).toLocaleString('pt-BR')} kg</div><div class="small">${esc(x.profiles?.full_name||'')}</div></div>`).join('');
}

sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN')setTimeout(boot,0)});
boot();
</script>
